name: Offline checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Offline protocol and receiver tests (no robot commands)
        run: python -m unittest -v test_feedback_diagnostic test_log_receiver_isolation test_precalibrated_two_sensor_telemetry
      - name: Check browser scripts
        run: for script in static/*.js; do node --check "$script"; done
